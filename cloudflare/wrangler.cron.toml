[[kv_namespaces]]
binding = "WORKER_STATE"
id = "7da58c97fdd140bbab29fb35d14bb001"
preview_id = "6a82b52b272645aaac2f216206ed8980"

# Rahasia di-set dengan `wrangler secret put`:
