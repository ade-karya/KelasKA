name = "kelaska-gateway"
main = "workers/gateway/src/index.ts"
compatibility_date = "2026-11-20"
route = { pattern = "api-kelas.riau.ai/*", zone_name = "riau.ai" }

[vars]
ORIGIN_VERCEL = "https://kelas.riau.ai"
ALLOWED_ORIGIN = "https://kelas.riau.ai"

# Namespace yang sama dipakai kelaska-cron. Ganti ID setelah `wrangler kv namespace create`.
[[kv_namespaces]]
binding = "WORKER_STATE"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"
