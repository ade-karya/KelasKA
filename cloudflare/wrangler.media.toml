name = "kelaska-media"
main = "workers/media/src/index.ts"
compatibility_date = "2026-11-20"
route = { pattern = "media-kelas.riau.ai/*", zone_name = "riau.ai" }

[vars]
# Path-style endpoint HF S3: https://s3.hf.co/<namespace>
S3_ENDPOINT = "https://s3.hf.co/REPLACE_NAMESPACE"
S3_BUCKET = "kelaska"
ALLOWED_ORIGIN = "https://kelas.riau.ai"

# Rahasia di-set dengan `wrangler secret put`:
#   MEDIA_TOKEN_SECRET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
