name: Build & Release Desktop App
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 0.3.0)'
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Next.js (standalone)
        run: pnpm build
        env:
          NEXT_PUBLIC_KELASKA_EDITOR_ENABLED: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop
      
      - name: Rebuild native modules
        run: npx @electron/rebuild
        working-directory: desktop
      
      - name: Build & Sign Installer
        run: npx electron-builder --win --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Code Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kelaska-windows-installers
          path: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.msi
            desktop/dist-electron/latest.yml
          retention-days: 90
