packages:
  - "packages/*"
  - "packages/@openmaic/*"
  - "!packages/docs" # standalone docs sub-app: own lockfile, build, deploy
allowBuilds:
  '@alicloud/openapi-core': true
  '@biomejs/biome': true
  '@google/genai': true
  '@scarf/scarf': false
  canvas: true
  core-js: false
  es5-ext: false
  esbuild: true
  msw: false
  # onnxruntime-node (via dev-only hyperframes CLI) downloads GPU binaries from
  # api.nuget.org in postinstall, which times out on Vercel (ETIMEDOUT/ENETUNREACH).
  # Not imported by Next.js build, so skip its install script.
  onnxruntime-node: false
  protobufjs: true
  sharp: true
  unrs-resolver: true
