<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kelas KA — Menunggu Backend</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } }
      .card { max-width: 34rem; margin: 2rem; padding: 2rem; border-radius: 1rem; border: 1px solid #cbd5e1; background: #fff; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
      @media (prefers-color-scheme: dark) { .card { background: #1e293b; border-color: #334155; } }
      h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
      p { line-height: 1.6; }
      code { background: #e2e8f0; padding: .1rem .35rem; border-radius: .3rem; }
      .pill { display: inline-block; padding: .25rem .6rem; border-radius: 999px; font-size: .8rem; font-weight: 600; background: #fef3c7; color: #92400e; }
      button { margin-top: 1rem; padding: .6rem 1rem; border: 0; border-radius: .5rem; background: #4f46e5; color: white; font-weight: 600; cursor: pointer; }
      .rows { margin-top: 1rem; font-size: .9rem; }
      .rows div { display: flex; justify-content: space-between; padding: .35rem 0; border-bottom: 1px solid #e2e8f0; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="pill" id="state">Memeriksa status…</span>
      <h1>Backend kelas sedang tidak aktif</h1>
      <p>
        Aplikasi utama dijalankan manual di Colab. Halaman ini tetap tersedia
        dari Vercel dan akan menampilkan status antrean. Permintaan pembuatan
        kelas sudah masuk antrean dan akan berjalan otomatis setelah operator
        menyalakan Colab.
      </p>
      <div class="rows" id="rows"></div>
      <button type="button" onclick="location.reload()">Muat ulang status</button>
    </main>
    <script>
      async function refresh() {
        try {
          const res = await fetch('/__kelaska/status', { cache: 'no-store' });
          if (!res.ok) throw new Error(String(res.status));
          const s = await res.json();
          const colab = s.colab?.status ?? 'unknown';
          const gpu = s.gpu?.status ?? 'unknown';
          const queue = s.queue ?? 0;
          document.getElementById('state').textContent =
            colab === 'online' ? 'Backend aktif — memuat ulang…' : `Colab ${colab} · antrean ${queue}`;
          document.getElementById('rows').innerHTML = [
            ['Colab', colab],
            ['GPU Kaggle', gpu],
            ['Antrean', queue],
            ['Kaggle session', s.kaggle?.status ?? 'unknown'],
          ].map(([k, v]) => `<div><span>${k}</span><strong>${v}</strong></div>`).join('');
          if (colab === 'online') setTimeout(() => location.reload(), 2000);
        } catch (e) {
          document.getElementById('state').textContent = 'Status tidak dapat dibaca';
        }
      }
      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
