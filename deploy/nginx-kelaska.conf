# Nginx snippet untuk KelasKA. TLS diasumsikan sudah terminasi di block
# server ini (sertifikat dikelola operator/ACME); di bawah hanya bagian yang
# relevan untuk Next.js + SSE/chat streaming.
#
# Cara pakai: include file ini dari dalam `server { listen 443 ssl; ... }`
# yang sudah punya ssl_certificate/ssl_certificate_key, atau salin isinya.

# Sinkron dengan site aktif /etc/nginx/sites-enabled/kelaska (otoritatif, JANGAN
# timpa file aktif dari sini). File ini hanya referensi snippet wajib.
# Site aktif: Cloudflare Tunnel TLS di edge → Nginx :80 → app 127.0.0.1:3000.
# Wajib ada di site aktif: (1) limit_req_zone verify + location login,
# (2) gzip off di /api/ agar SSE tidak ERR_INCOMPLETE_CHUNKED_ENCODING.

# Rate limit khusus login/access-code (app juga throttle per-IP bila TRUST_PROXY_HEADERS=true)
limit_req_zone $binary_remote_addr zone=verify:10m rate=10r/m;

upstream kelaska_app {
  server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
  keepalive 32;
}

# Login username+password — rate limit lapisan depan anti-brute-force
location = /api/auth/login {
  limit_req zone=verify burst=5 nodelay;
  proxy_pass http://kelaska_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_buffering off;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
}

# API + streaming (SSE chat, agent events): tanpa buffer, timeout panjang,
# gzip MATI di sini (kompresi nginx men-buffer chunked SSE).
location /api/ {
  gzip off;
  proxy_pass http://kelaska_app;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_cache off;
  proxy_connect_timeout 60s;
  proxy_send_timeout 900s;
  proxy_read_timeout 900s;
  send_timeout 900s;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
}

location / {
  proxy_pass http://kelaska_app;
  proxy_http_version 1.1;

  # SSE / streaming chat: jangan buffer jawaban model.
  proxy_buffering off;
  proxy_cache off;
  chunked_transfer_encoding on;

  # Turn opencode bisa lama (default tool timeout 10 mnt); beri ruang 300s.
  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  # Identitas klien untuk rate-limit/access-code (lihat TRUST_PROXY_HEADERS).
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  # WebSocket (bila dipakai HMR/live): upgrade headers.
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
}
