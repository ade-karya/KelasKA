# Template otomatisasi rilis Android.
#
# Berkas ini sengaja TIDAK berada di `.github/workflows/` karena penambahan
# workflow memerlukan token GitHub dengan scope `workflow`; token gh di host
# ini hanya punya `repo`/`gist`/`read:org`. Salin ke
# `.github/workflows/release.yml` (dan isi empat secret Android di README)
# dengan akun yang berwenang, lalu tag `v*` akan membangun dan menerbitkan APK.
name: Android Release

# Rilis APK bertanda tangan saat tag `vX.Y.Z` didorong. Aplikasi hanya membaca
# GitHub Releases `/releases/latest`, jadi tag harus rilis stabil (bukan draf).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # versionName harus sama dengan tag dan versionCode harus naik dari tag
      # sebelumnya; Android menolak memasang APK dengan versionCode yang tidak
      # bertambah, jadi rilis yang melanggar aturan itu dihentikan di sini.
      - name: Validate tag against app/build.gradle.kts
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          GRADLE_FILE=android/app/build.gradle.kts
          VERSION_NAME=$(sed -n 's/^ *versionName *= *"\([^"]*\)"/\1/p' "$GRADLE_FILE" | head -1)
          VERSION_CODE=$(sed -n 's/^ *versionCode *= *\([0-9][0-9]*\).*/\1/p' "$GRADLE_FILE" | head -1)
          if [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::tag $TAG tidak sama dengan versionName v$VERSION_NAME"
            exit 1
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG" "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            PREV_CODE=$(git show "$PREV_TAG:$GRADLE_FILE" \
              | sed -n 's/^ *versionCode *= *\([0-9][0-9]*\).*/\1/p' | head -1)
            if [ -n "$PREV_CODE" ] && [ "$VERSION_CODE" -le "$PREV_CODE" ]; then
              echo "::error::versionCode $VERSION_CODE harus lebih besar dari $PREV_CODE ($PREV_TAG)"
              exit 1
            fi
          fi

      - name: Unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest --console=plain

      # Keystore hanya hidup selama job berjalan (dihapus bersama runner).
      - name: Assemble signed release
        env:
          KELAS_KA_STORE_FILE: ${{ github.workspace }}/release.keystore
          KELAS_KA_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KELAS_KA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KELAS_KA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > release.keystore
          cd android
          ./gradlew :app:assembleRelease --console=plain

      - name: Verify signature and write checksum
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          OUT="KelasKA-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "KelasKA-${GITHUB_REF_NAME}.apk" \
            "KelasKA-${GITHUB_REF_NAME}.apk.sha256" \
            --title "Kelas KA Android ${GITHUB_REF_NAME}" \
            --notes "APK rilis ${GITHUB_REF_NAME}. Signature sama dengan rilis sebelumnya, jadi pembaruan dapat dipasang di tempat melalui Cek pembaruan di aplikasi."
